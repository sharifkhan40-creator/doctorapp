<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Doctor App — Find Trusted Doctors & Hospitals</title>
<meta name="description" content="Find trusted doctors, hospitals, ambulances and health articles near you." />
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>
<div class="drawer-back" id="drawerBack" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>
<div class="notif-back" id="notifBack" onclick="closeNotif()"></div>
<div class="notif-panel" id="notifPanel"></div>
<div class="profile-back" id="profileBack" onclick="if(event.target===this)closeProfile()">
  <div class="profile-panel" id="profilePanel"></div>
</div>
<div class="ai-back" id="aiBack" onclick="if(event.target===this)closeDrAI()">
  <div class="ai-panel" id="aiPanel">
    <div class="ai-head">
      <div class="ai-avatar"><svg viewBox="0 0 24 24"><path d="M6 3v5a6 6 0 0 0 12 0V3"/><path d="M6 3h2M16 3h2"/><circle cx="18" cy="15" r="2"/><path d="M18 17v3a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3v-5"/></svg></div>
      <div class="ai-info"><div class="ai-title">AI Assistant</div><div class="ai-sub">Your virtual medical assistant</div></div>
      <button class="ai-clear" onclick="clearAIChat()">Clear</button>
      <button class="ai-close" onclick="closeDrAI()">×</button>
    </div>
    <div class="ai-body" id="aiBody"></div>
    <div class="ai-foot">
      <input class="ai-input" id="aiInput" placeholder="Type your message…" onkeydown="if(event.key==='Enter')aiSend()">
      <button class="ai-send" onclick="aiSend()"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
    </div>
  </div>
</div>
<div class="modal-back" id="modalBack">
  <div class="modal" id="modalBox"></div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
